<app-section-header [title]="'technologies.title' | translate" />
<p class="secondary">
  {{ (isMobile ? 'technologies.hint_mobile' : 'technologies.hint_desktop') | translate }}
</p>
<div
  class="tech-grid"
  observeVisibility
  (visibilityChange)="onVisibilityChange($event)"
  [class.visible]="visible()"
>
  <app-tech-icon iconName="angular" />
  <app-tech-icon iconName="c-sharp" />
  <app-tech-icon iconName="typescript" />
  <app-tech-icon iconName="javascript" />
  <app-tech-icon iconName="html5" />
</div>
